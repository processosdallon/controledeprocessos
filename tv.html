<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel TV — Dallon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: #0a1a0a;
    color: #eee;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .tv-header {
    background: #1e4d2b;
    padding: 8px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 3px solid #a8d44d;
    flex-shrink: 0;
  }
  .tv-header img { height: 48px; }
  .tv-header-center h1 { font-size: 20px; color: #a8d44d; letter-spacing: 2px; text-transform: uppercase; text-align: center; }
  .tv-header-center p { font-size: 11px; color: #7ab830; text-align: center; margin-top: 2px; }
  .tv-header-right { text-align: right; }
  .tv-header-right .relogio { font-size: 26px; font-weight: bold; color: #fff; }
  .tv-header-right .data { font-size: 11px; color: #7ab830; }

  .tv-status {
    background: #163d21;
    padding: 4px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 12px;
    color: #7ab830;
    border-bottom: 1px solid #2d6a3f;
    flex-shrink: 0;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #ccc; display: inline-block; }
  .dot.on { background: #a8d44d; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .status-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .secao-badge {
    font-size: 12px; font-weight: bold; color: #1e4d2b;
    background: #a8d44d; padding: 2px 14px; border-radius: 10px;
  }
  .slide-info { font-size: 11px; color: #5a9a5a; }

  /* SLIDE */
  .slide-outer { flex: 1; overflow: hidden; position: relative; }
  .slide-viewport {
    display: flex;
    height: 100%;
    transition: transform 0.6s cubic-bezier(0.77,0,0.175,1);
  }
  .slide-page {
    min-width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 12px 16px 8px;
    gap: 8px;
  }

  /* TÍTULO DA SEÇÃO DENTRO DO SLIDE */
  .secao-titulo-slide {
    font-size: 12px;
    font-weight: bold;
    color: #fff;
    background: #1e4d2b;
    padding: 3px 12px;
    border-radius: 5px;
    border-left: 4px solid #a8d44d;
    letter-spacing: 1px;
    flex-shrink: 0;
  }

  /* GRID DE CARDS — sempre 4 colunas, centralizado */
  .cards-row {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex: 1;
    min-height: 0;
  }

  /* CARD */
  .card-tv {
    background: #0f2218;
    border: 1.5px solid #2d6a3f;
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    flex: 1;
    max-width: 380px;
    min-width: 0;
  }
  .card-tv.atrasado {
    border: 2px solid #c00 !important;
    box-shadow: 0 0 14px #f006;
  }

  /* TOPO: Liga + Panela */
  .card-top {
    background: #163d21;
    padding: 6px 10px 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    border-bottom: 2px solid #2d6a3f;
    flex-shrink: 0;
  }
  .card-tv.atrasado .card-top { background: #5a0000; border-bottom: 2px solid #c00; }
  .card-liga-tv {
    font-size: 13px;
    font-weight: bold;
    color: #a8d44d;
    text-align: center;
    letter-spacing: 0.5px;
  }
  .card-tv.atrasado .card-liga-tv { color: #ffaaaa; }
  .card-panela-box {
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    background: #1e4d2b;
    padding: 2px 20px;
    border-radius: 6px;
    border: 1.5px solid #a8d44d;
    letter-spacing: 2px;
    text-align: center;
  }
  .card-tv.atrasado .card-panela-box {
    background: #c00;
    border-color: #ff9999;
  }

  /* HEADER: Lote + Badge */
  .card-header-tv {
    background: #1e4d2b;
    padding: 5px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .card-tv.atrasado .card-header-tv { background: #c00; }
  .card-lote-tv { font-size: 13px; font-weight: bold; color: #fff; }
  .tempo-total-tv { font-size: 11px; color: #a8d44d; font-weight: bold; display: block; text-align: center; margin-top: 2px; }
  .card-tv.atrasado .tempo-total-tv { color: #ffaaaa; }
  .badge-andamento {
    background: #a8d44d; color: #1e4d2b;
    font-size: 9px; font-weight: bold;
    padding: 2px 8px; border-radius: 10px;
  }
  .badge-atraso {
    background: #fff; color: #c00;
    font-size: 9px; font-weight: bold;
    padding: 2px 8px; border-radius: 10px;
    animation: pisca 1s infinite;
  }
  @keyframes pisca { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* TABELA */
  .card-table { width: 100%; border-collapse: collapse; flex: 1; }
  .card-table th {
    background: #163d21; color: #a8d44d;
    font-size: 11px; padding: 4px 8px;
    text-align: left; border-bottom: 1px solid #2d6a3f;
  }
  .card-tv.atrasado .card-table th { background: #5a0000; color: #ffd0d0; }
  .card-table td {
    padding: 5px 8px;
    border-bottom: 1px solid #1a3a20;
    font-size: 12px; color: #bbb;
  }
  .card-tv.atrasado .card-table td { background: #ffe0e0 !important; border-bottom: 1px solid #f5a0a0 !important; color: #900; }
  .etapa-tv { color: #ccc !important; }
  .card-tv.atrasado .etapa-tv { color: #900 !important; font-weight: bold; }
  .medio-tv { font-size: 9px; color: #3a6a3a; display: block; }
  .exec-tv { font-size: 10px; color: #5ab8d4; display: block; font-weight: bold; margin-top: 2px; }
  .val { color: #fff !important; font-weight: bold; font-size: 13px; }
  .card-tv.atrasado .val { color: #c00 !important; }
  .vz { color: #2a4a2a !important; font-style: italic; }
  .tr-ativa { background: #0d2a18 !important; }
  .card-tv.atrasado .tr-ativa { background: #fff0f0 !important; }
  .tr-ativa .etapa-tv { color: #a8d44d !important; font-weight: bold; }
  .card-tv.atrasado .tr-ativa .etapa-tv { color: #c00 !important; }

  .card-obs {
    padding: 4px 10px; font-size: 10px; color: #5a8a5a;
    border-top: 1px solid #1a3a20; flex-shrink: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card-tv.atrasado .card-obs { background: #ffe0e0; color: #900; }
  .setup-tv {
    background: #3a0000; color: #ffaaaa;
    font-size: 11px; padding: 3px 8px;
    border-top: 1px solid #c00;
    font-weight: bold; text-align: center;
    animation: pisca 1.5s infinite; flex-shrink: 0;
  }

  /* SEM ATIVOS */
  .sem-ativos {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; color: #2d6a3f; font-size: 20px; gap: 12px;
  }
  .sem-ativos span { font-size: 52px; }


  /* NAVEGAÇÃO MANUAL */
  .nav-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(30,77,43,0.7);
    border: 2px solid #a8d44d;
    color: #a8d44d;
    font-size: 32px;
    width: 52px;
    height: 80px;
    border-radius: 8px;
    cursor: pointer;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
    user-select: none;
  }
  .nav-btn:hover { background: rgba(30,77,43,0.95); color: #fff; }
  .nav-btn:active { background: #1e4d2b; }
  .nav-prev { left: 8px; }
  .nav-next { right: 8px; }
  .nav-btn.oculto { opacity: 0; pointer-events: none; }

  @media (max-width: 768px) {
    body { font-size: 11px; }
    .tv-header { padding: 6px 12px; }
    .tv-header img { height: 32px; }
    .tv-header-center h1 { font-size: 13px; letter-spacing: 1px; }
    .tv-header-center p { font-size: 10px; }
    .tv-header-right .relogio { font-size: 18px; }
    .tv-header-right .data { font-size: 10px; }
    .tv-status { padding: 3px 12px; font-size: 11px; }
    .slide-page { padding: 8px 8px 4px; gap: 8px; }
    .cards-row { flex-direction: column; gap: 10px; overflow-y: auto; }
    .card-tv { max-width: 100%; min-width: 0; }
    .card-top { padding: 5px 8px; }
    .card-liga-tv { font-size: 12px; }
    .card-panela-box { font-size: 16px; padding: 2px 12px; }
    .tempo-total-tv { font-size: 10px; }
    .card-header-tv { padding: 4px 8px; }
    .card-lote-tv { font-size: 12px; }
    .card-table th { font-size: 10px; padding: 3px 5px; }
    .card-table td { font-size: 11px; padding: 3px 5px; }
    .etapa-tv { font-size: 11px; }
    .medio-tv { font-size: 8px; }
    .exec-tv { font-size: 9px; }
    .val { font-size: 11px; }
    .nav-btn { width: 36px; height: 56px; font-size: 22px; }
    .slide-dots { padding: 2px 0; }
    .secao-titulo-slide { font-size: 11px; }
    .badge-andamento, .badge-atraso { font-size: 8px; padding: 1px 5px; }
    .setup-tv { font-size: 10px; }
    .card-obs { font-size: 9px; }
  }
  /* DOTS */
  .slide-dots {
    display: flex; justify-content: center; gap: 8px;
    padding: 4px 0; flex-shrink: 0;
  }
  .slide-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #2d6a3f; transition: background 0.3s;
  }
  .slide-dot.ativo { background: #a8d44d; }
</style>
</head>

  setInterval(tick,1000); tick();

  const ETAPAS_SUP = [
    {k:'limp1_ini',   k2:'limp1_fim',   l:'1ª Limpeza',        m:60},
    {k:'desest_ini',  k2:'desest_fim',  l:'Desestanhação',      m:120},
    {k:'lanca_ini',    k2:'lanca_fim',    l:'Desant. c/ Lança',    m:330},
    {k:'setuptemp_ini', k2:'setuptemp_fim', l:'Setup de Temperatura', m:null},
    {k:'desant1_ini', k2:'desant1_fim', l:'1ª Desantimoniação', m:120},
    {k:'decup_ini',   k2:'decup_fim',   l:'Decuprização',       m:150},
    {k:'transf_ini',  k2:'transf_fim',  l:'1ª Transferência',   m:60},
    {k:'desant2_ini', k2:'desant2_fim', l:'2ª Desantimoniação', m:330},
    {k:'limpeza1_ini',k2:'limpeza1_fim',l:'1ª Limpeza Final',   m:120},
    {k:'transf2_ini', k2:'transf2_fim', l:'2ª Transferência',   m:60},
    {k:'limpeza2_ini',k2:'limpeza2_fim',l:'2ª Limpeza Final',   m:120},
    {k:'metais_ini',  k2:'metais_fim',  l:'Agregar Metais',     m:300},
    {k:'lingot_ini',  k2:'lingot_fim',  l:'Lingotamento',       m:null},
  ];
  const ETAPAS_INF = [
    {k:'limp1_ini',   k2:'limp1_fim',   l:'1ª Limpeza',        m:60},
    {k:'enxofre_ini', k2:'enxofre_fim', l:'Dec. Com Enxofre',  m:180},
    {k:'desest_ini',  k2:'desest_fim',  l:'Desestanhação',      m:300},
    {k:'transf_ini',  k2:'transf_fim',  l:'Transferência',      m:null},
    {k:'soda_ini',    k2:'soda_fim',    l:'Limpeza c/ Soda',    m:120},
    {k:'carvao_ini',  k2:'carvao_fim',  l:'Limpeza c/ Carvão',  m:120},
    {k:'metais_ini',  k2:'metais_fim',  l:'Agregar Metais',     m:240},
    {k:'lingot_ini',  k2:'lingot_fim',  l:'Lingotamento',       m:null},
  ];

  let dados = {};
  let slideAtual = 0;
  let totalSlides = 0;
  let slidesMeta = []; // {tipo, cards[]}
  let slideTimer = null;
  const INTERVALO = 30000; // 30 segundos

  function toMin(s) { const [h,m]=s.split(':').map(Number); return h*60+m; }

  function isAtrasado(p, etapas) {
    const agoraMin = new Date().getHours()*60+new Date().getMinutes();
    let ultimaIdx=-1;
    etapas.forEach((e,i)=>{ if(dados[`${p}_${e.k}`]) ultimaIdx=i; });
    if(ultimaIdx<0) return false;
    const fim=dados[`${p}_${etapas[ultimaIdx].k2}`]||'';
    if(!fim) return false;
    const fimMin=toMin(fim);
    return !(fimMin>22*60&&agoraMin<2*60) && agoraMin>fimMin;
  }

  function renderCard(p, etapas) {
    const lote   = dados[`${p}_lote`]||'—';
    const panela = dados[`${p}_panela`]||'—';
    const liga   = dados[`${p}_liga`]||'';
    const obs    = dados[`${p}_obs`]||'';
    const setup  = dados[`${p}_setup_motivo`]||'';
    let atr      = isAtrasado(p,etapas);

    // Tempo total de processo
    let tempoTotalTv = '';
    const etapasComIni = etapas.map(e => dados[`${p}_${e.k}`]).find(v => v);
    if (etapasComIni) {
      const agr = new Date();
      const [hpi,mpi] = etapasComIni.split(':').map(Number);
      const iniT = new Date(agr); iniT.setHours(hpi,mpi,0,0);
      if (iniT > agr) iniT.setDate(iniT.getDate()-1);
      const dT = Math.floor((agr-iniT)/60000);
      tempoTotalTv = `<span class="tempo-total-tv">⏳ ${Math.floor(dT/60)}:${String(dT%60).padStart(2,'0')}h em processo</span>`;
    }

    let ultimaIdx=-1;
    etapas.forEach((e,i)=>{ if(dados[`${p}_${e.k}`]) ultimaIdx=i; });

    // Lingotamento iniciado → não considera atraso
    const lingotKey = etapas.find(e2 => e2.k.includes('lingot'));
    const lingotIniciado = lingotKey ? !!dados[`${p}_${lingotKey.k}`] : false;
    if (lingotIniciado) atr = false;

    const rows = etapas.map((e,idx)=>{
      const ini=dados[`${p}_${e.k}`]||'';
      const fim=dados[`${p}_${e.k2}`]||'';
      const ativa=idx===ultimaIdx;
      const med=e.m?`<span class="medio-tv">T.M: ${Math.floor(e.m/60)}:${String(e.m%60).padStart(2,'0')}h</span>`:'';
      // Tempo de execução
      let exec='';
      if(ini){
        const prox=etapas.slice(idx+1).find(e2=>dados[`${p}_${e2.k}`]);
        if(prox){
          const pi=dados[`${p}_${prox.k}`];
          const [h1,m1]=ini.split(':').map(Number);
          const [h2,m2]=pi.split(':').map(Number);
          let diff=(h2*60+m2)-(h1*60+m1);
          if(diff<0) diff+=24*60;
          exec=`<span class="exec-tv">Tempo de Execução: ${Math.floor(diff/60)}:${String(diff%60).padStart(2,'0')}h</span>`;
        }
      }
      return `<tr class="${ativa?'tr-ativa':''}">
        <td class="etapa-tv">${e.l}${med}${exec}</td>
        <td class="${ini?'val':'vz'}">${ini||'—'}</td>
        <td class="${fim?'val':'vz'}">${fim||'—'}</td>
      </tr>`;
    }).join('');

    const badge=atr?'<span class="badge-atraso">⚠ ATRASO</span>':'<span class="badge-andamento">● EM ANDAMENTO</span>';

    return `<div class="card-tv${atr?' atrasado':''}">
      <div class="card-top">
        ${liga?`<div class="card-liga-tv">⚗️ ${liga}</div>`:''}
        <div class="card-panela-box">Panela ${panela}</div>
        ${tempoTotalTv}
      </div>
      <div class="card-header-tv">
        <span class="card-lote-tv">Lote: ${lote}</span>${badge}
      </div>
      <table class="card-table">
        <thead><tr><th>Etapa</th><th>Início</th><th>Prev. Fim</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${obs?`<div class="card-obs">OBS: ${obs}</div>`:''}
      ${setup?`<div class="setup-tv">⚠️ SETUP: ${setup}</div>`:''}
    </div>`;
  }

  function buildSlides() {
    // Coletar ativos
    const sup=[], inf=[];
    // Coletar ativos e ordenar por número de panela crescente
    for(let i=1;i<=8;i++) { if(dados[`a${i}_lote`]) sup.push({p:`a${i}`,etapas:ETAPAS_SUP,tipo:'PURO/CÁLCIO',panela:parseInt(dados[`a${i}_panela`])||999}); }
    sup.sort((a,b)=>a.panela-b.panela);
    for(let i=1;i<=2;i++) { if(dados[`b${i}_lote`]) inf.push({p:`b${i}`,etapas:ETAPAS_INF,tipo:'SB/SN',panela:parseInt(dados[`b${i}_panela`])||999}); }
    inf.sort((a,b)=>a.panela-b.panela);

    slidesMeta = [];
    // Slides de sup (4 por slide)
    for(let i=0;i<sup.length;i+=4) slidesMeta.push({tipo:'PURO/CÁLCIO',cards:sup.slice(i,i+4)});
    // Slides de inf (4 por slide, mas temos max 2)
    if(inf.length) slidesMeta.push({tipo:'SB/SN',cards:inf});

    totalSlides = slidesMeta.length;
    return {sup,inf};
  }

  function buildUI() {
    const vp=document.getElementById('viewport');
    const dotsEl=document.getElementById('dots');

    const {sup,inf}=buildSlides();

    if(!sup.length&&!inf.length) {
      vp.style.transition='none';
      vp.innerHTML='<div class="slide-page"><div class="sem-ativos"><span>⏳</span>Nenhuma panela em andamento</div></div>';
      dotsEl.innerHTML='';
      document.getElementById('slide-info').textContent='';
      document.getElementById('secao-badge').textContent='';
      return;
    }

    const pagesHtml = slidesMeta.map(s=>{
      const cardsHtml = s.cards.map(c=>renderCard(c.p,c.etapas)).join('');
      const titulo = s.tipo==='PURO/CÁLCIO' ? '🏭 PANELAS DE PURO/CÁLCIO' : '⚗️ PANELAS DE SB/SN';
      return `<div class="slide-page">
        <div class="secao-titulo-slide">${titulo}</div>
        <div class="cards-row">${cardsHtml}</div>
      </div>`;
    }).join('');

    vp.style.transition='none';
    vp.innerHTML=pagesHtml;

    dotsEl.innerHTML = totalSlides>1
      ? slidesMeta.map((_,i)=>`<div class="slide-dot${i===slideAtual?' ativo':''}"></div>`).join('')
      : '';

    const cur = slideAtual<totalSlides?slideAtual:0;
    goTo(cur,false);
  }

  function goTo(idx,animate=true) {
    slideAtual=idx;
    const vp=document.getElementById('viewport');
    if(!vp) return;
    if(!animate) vp.style.transition='none';
    else vp.style.transition='transform 0.6s cubic-bezier(0.77,0,0.175,1)';
    vp.style.transform=`translateX(-${idx*100}%)`;
    if(!animate) setTimeout(()=>vp.style.transition='',50);
    document.querySelectorAll('.slide-dot').forEach((d,i)=>d.classList.toggle('ativo',i===idx));
    if(slidesMeta[idx]) {
      document.getElementById('secao-badge').textContent=slidesMeta[idx].tipo;
      document.getElementById('slide-info').textContent=totalSlides>1?`Slide ${idx+1} de ${totalSlides}`:'';
    }
    // Atualizar visibilidade dos botões
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    if(btnPrev) btnPrev.classList.toggle('oculto', totalSlides<=1);
    if(btnNext) btnNext.classList.toggle('oculto', totalSlides<=1);
  }

  window.navManual = (dir) => {
    if(totalSlides<=1) return;
    goTo((slideAtual + dir + totalSlides) % totalSlides);
    // Reiniciar timer para dar tempo completo após navegação manual
    iniciarTimer();
  };

  // Suporte a teclado (setas) e swipe em touch
  document.addEventListener('keydown', e => {
    if(e.key==='ArrowRight') navManual(1);
    if(e.key==='ArrowLeft') navManual(-1);
  });

  // Swipe touch
  let touchStartX = 0;
  document.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive:true});
  document.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if(Math.abs(diff) > 50) navManual(diff > 0 ? 1 : -1);
  }, {passive:true});

  function nextSlide() {
    if(totalSlides<=1) return;
    goTo((slideAtual+1)%totalSlides);
  }

  function iniciarTimer() {
    if(slideTimer) clearInterval(slideTimer);
    slideTimer=setInterval(nextSlide,INTERVALO);
  }

  onValue(ref(db,'formulario/dados'),(snap)=>{
    document.getElementById('dot').className='dot on';
    document.getElementById('status-txt').textContent='🟢 Conectado — tempo real';
    dados=snap.val()||{};
    buildUI();
    iniciarTimer();
  },()=>{
    document.getElementById('dot').className='dot';
    document.getElementById('status-txt').textContent='🔴 Sem conexão';
  });

  setInterval(()=>buildUI(),60000);
</script>
</body>
</html>
