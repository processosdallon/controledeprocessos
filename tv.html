<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="300">
<title>Painel TV — Dallon</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, sans-serif;
    background: #0a1a0a;
    color: #eee;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  .tv-header {
    background: #1e4d2b;
    padding: 14px 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 4px solid #a8d44d;
    flex-shrink: 0;
  }
  .tv-header img { height: 64px; }
  .tv-header-center h1 { font-size: 32px; color: #a8d44d; letter-spacing: 2px; text-transform: uppercase; text-align: center; }
  .tv-header-center p { font-size: 16px; color: #7ab830; text-align: center; margin-top: 2px; }
  .tv-header-right { text-align: right; }
  .tv-header-right .relogio { font-size: 42px; font-weight: bold; color: #fff; }
  .tv-header-right .data { font-size: 15px; color: #7ab830; }

  /* STATUS */
  .tv-status {
    background: #163d21;
    padding: 7px 30px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 16px;
    color: #7ab830;
    border-bottom: 1px solid #2d6a3f;
    flex-shrink: 0;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; display: inline-block; }
  .dot.on { background: #a8d44d; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .status-right { margin-left: auto; display: flex; align-items: center; gap: 16px; }
  .secao-badge { font-size: 14px; font-weight: bold; color: #1e4d2b; background: #a8d44d; padding: 3px 16px; border-radius: 10px; }
  .slide-info { font-size: 13px; color: #5a9a5a; }

  /* SLIDE */
  .slide-outer { flex: 1; overflow: hidden; position: relative; }
  .slide-viewport {
    display: flex;
    height: 100%;
    transition: transform 0.7s cubic-bezier(0.77,0,0.175,1);
  }
  .slide-page {
    min-width: 100%;
    height: 100%;
    padding: 12px 24px 8px;
    display: flex;
    flex-direction: column;
  }

  /* TÍTULO DA SEÇÃO */
  .secao-titulo-slide {
    font-size: 19px;
    font-weight: bold;
    color: #fff;
    background: #1e4d2b;
    padding: 5px 16px;
    border-radius: 6px;
    border-left: 5px solid #a8d44d;
    letter-spacing: 1px;
    flex-shrink: 0;
    margin-bottom: 10px;
  }

  /* CARD — 1 por slide, ocupa toda a área */
  .card-tv {
    background: #0f2218;
    border: 2px solid #2d6a3f;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }

  .card-tv.atrasado {
    border: 3px solid #c00 !important;
    box-shadow: 0 0 20px #f006;
  }

  /* TOPO DO CARD */
  .card-top {
    background: #163d21;
    padding: 12px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid #2d6a3f;
    flex-shrink: 0;
    gap: 16px;
  }
  .card-centro {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    flex: 1;
  }
  .card-panela-destaque {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    min-width: 220px;
  }
  .card-tv.atrasado .card-top { background: #5a0000; border-bottom: 2px solid #c00; }

  .card-inicio-box, .card-prevfim-box {
    display: flex;
    flex-direction: column;
    min-width: 140px;
  }
  .card-inicio-box { align-items: flex-start; }
  .card-prevfim-box { align-items: flex-end; }
  .card-label-top {
    font-size: 16px;
    color: #a8d44d;
    font-weight: bold;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .card-tv.atrasado .card-label-top { color: #ffaaaa; }
  .card-valor-top {
    font-size: 26px;
    color: #fff;
    font-weight: bold;
  }
  .card-tv.atrasado .card-valor-top { color: #ffcccc; }

  .card-centro {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .card-liga-tv {
    font-size: 20px;
    font-weight: bold;
    color: #a8d44d;
    text-align: center;
  }
  .card-tv.atrasado .card-liga-tv { color: #ffaaaa; }
  .card-panela-box {
    font-size: 52px;
    font-weight: bold;
    color: #fff;
    background: #1e4d2b;
    padding: 4px 28px;
    border-radius: 8px;
    border: 2px solid #a8d44d;
    letter-spacing: 2px;
  }
  .card-tv.atrasado .card-panela-box { background: #c00; border-color: #ff9999; }
  .tempo-total-tv {
    font-size: 22px;
    color: #a8d44d;
    font-weight: bold;
    text-align: center;
    margin-top: 2px;
  }
  .card-tv.atrasado .tempo-total-tv { color: #ffaaaa; }

  /* HEADER: Lote + Badge */
  .card-header-tv {
    background: #1e4d2b;
    padding: 8px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .card-tv.atrasado .card-header-tv { background: #c00; }
  .card-lote-tv { font-size: 26px; font-weight: bold; color: #fff; }
  .badge-andamento {
    background: #a8d44d; color: #1e4d2b;
    font-size: 16px; font-weight: bold;
    padding: 6px 18px; border-radius: 10px;
  }
  .badge-atraso {
    background: #fff; color: #c00;
    font-size: 16px; font-weight: bold;
    padding: 6px 18px; border-radius: 10px;
    animation: pisca 1s infinite;
  }
  @keyframes pisca { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* TABELA DUPLA */
  .tabelas-wrap { display: flex; flex: 1; min-height: 0; }
  .tabela-col { flex: 1; min-width: 0; overflow: hidden; }
  .tabela-col:first-child { border-right: 3px solid #2d6a3f; }
  .card-tv.atrasado .tabela-col:first-child { border-right-color: #c00; }

  /* TABELA */
  .card-table { width: 100%; border-collapse: collapse; flex: 1; }
  .card-table th {
    background: #163d21; color: #a8d44d;
    font-size: 20px; padding: 10px 16px;
    text-align: left; border-bottom: 2px solid #2d6a3f;
  }
  .card-tv.atrasado .card-table th { background: #5a0000; color: #ffd0d0; }
  .card-table td {
    padding: 10px 16px;
    border-bottom: 1px solid #1a3a20;
    font-size: 20px; color: #bbb;
    vertical-align: middle;
  }
  .card-tv.atrasado .card-table td { background: #ffe0e0 !important; border-bottom: 1px solid #f5a0a0 !important; color: #900; }
  .etapa-tv { color: #ccc !important; font-size: 20px; }
  .card-tv.atrasado .etapa-tv { color: #900 !important; font-weight: bold; }
  .medio-tv { font-size: 13px; color: #3a6a3a; display: block; }
  .exec-tv { font-size: 14px; color: #5ab8d4; display: block; font-weight: bold; margin-top: 2px; }
  .val { color: #fff !important; font-weight: bold; font-size: 22px; }
  .card-tv.atrasado .val { color: #c00 !important; }
  .vz { color: #2a4a2a !important; font-style: italic; font-size: 18px; }
  .tr-ativa { background: #0d2a18 !important; }
  .card-tv.atrasado .tr-ativa { background: #fff0f0 !important; }
  .tr-ativa .etapa-tv { color: #a8d44d !important; font-weight: bold; font-size: 21px; }
  .card-tv.atrasado .tr-ativa .etapa-tv { color: #c00 !important; }
  .linha-atr-tv td { background: #ffe0e0 !important; color: #900 !important; }
  .card-tv.atrasado .linha-atr-tv td { background: #5a1010 !important; }

  .card-obs {
    padding: 6px 20px; font-size: 15px; color: #5a8a5a;
    border-top: 1px solid #1a3a20; flex-shrink: 0;
    max-height: 52px; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .card-tv.atrasado .card-obs { background: #ffe0e0; color: #900; }
  .setup-tv {
    background: #3a0000; color: #ffaaaa;
    font-size: 16px; padding: 5px 20px;
    border-top: 1px solid #c00; font-weight: bold;
    text-align: center; animation: pisca 1.5s infinite; flex-shrink: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* SEM ATIVOS */
  .sem-ativos {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; color: #2d6a3f; font-size: 24px; gap: 16px;
  }
  .sem-ativos span { font-size: 72px; }


  /* SÍMBOLO GIRATÓRIO — mantém TV ativa */
  .logo-spin-wrap {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 90px;
    height: 90px;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 0 8px rgba(168,212,77,0.6));
  }
  .logo-spin {
    width: 90px;
    height: 90px;
    object-fit: contain;
    animation: girar 6s linear infinite;
  }
  @keyframes girar {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  /* DOTS */
  .slide-dots {
    display: flex; justify-content: center; gap: 10px;
    padding: 6px 0; flex-shrink: 0;
  }
  .slide-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #2d6a3f; transition: background 0.3s;
  }
  .slide-dot.ativo { background: #a8d44d; }

  /* NAV BUTTONS */
  .nav-btn {
    position: fixed; top: 50%; transform: translateY(-50%);
    background: rgba(30,77,43,0.7); border: 2px solid #a8d44d;
    color: #a8d44d; font-size: 40px; width: 60px; height: 100px;
    border-radius: 10px; cursor: pointer; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s; user-select: none;
  }
  .nav-btn:hover { background: rgba(30,77,43,0.95); color: #fff; }
  .nav-prev { left: 6px; }
  .nav-next { right: 6px; }
</style>
</head>

  // MANTER TELA LIGADA — múltiplos métodos para TVs LG
  async function manterTelaLigada() {
    // Método 1: Wake Lock API
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          wakeLock.addEventListener('release', () => {
            setTimeout(requestWakeLock, 1000);
          });
        }
      } catch(e) {}
    }
    await requestWakeLock();
    document.addEventListener('visibilitychange', async () => {
      if (document.visibilityState === 'visible') await requestWakeLock();
    });

    // Método 2: Canvas animado invisível — engana o browser achando que há animação
    const canvas = document.createElement('canvas');
    canvas.width = 2; canvas.height = 2;
    canvas.style.cssText = 'position:fixed;top:0;left:0;opacity:0.01;pointer-events:none;z-index:-1;';
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    let frame = 0;
    function animateCanvas() {
      ctx.fillStyle = frame++ % 2 === 0 ? '#000001' : '#000000';
      ctx.fillRect(0, 0, 2, 2);
      requestAnimationFrame(animateCanvas);
    }
    animateCanvas();

    // Método 3: Simular interação do usuário a cada 15 segundos
    setInterval(() => {
      document.dispatchEvent(new MouseEvent('mousemove', { bubbles: true, clientX: Math.random() * 10, clientY: Math.random() * 10 }));
      document.dispatchEvent(new KeyboardEvent('keydown', { bubbles: true, key: 'Shift' }));
      document.dispatchEvent(new TouchEvent('touchstart', { bubbles: true }));
    }, 15000);

    // Método 4: Logo animada via CSS — mantém TV ativa visualmente

    // Recarregar a cada 20 minutos — antes dos 30min de inatividade da LG
    setTimeout(() => { location.reload(); }, 5 * 60 * 1000);
  }
  manterTelaLigada();

    const setupFim=dados[`${p}_setup_fim`]||'';
    const agoraMin=new Date().getHours()*60+new Date().getMinutes();
    if(setupMotivo&&setupIni&&ultimaIni){
      const mS=toMin(setupIni),mE=toMin(ultimaIni);
      const diff=mS-mE;
      const depois=Math.abs(diff)>720?diff<0:diff>0;
      if(depois){
        if(!setupFim) return false;
        const fimMin=toMin(setupFim);
        return !(fimMin>22*60&&agoraMin<2*60)&&agoraMin>fimMin;
      }
    }
    const fim=dados[`${p}_${etapas[ultimaIdx].k2}`]||'';
    if(!fim) return false;
    const fimMin=toMin(fim);
    return !(fimMin>22*60&&agoraMin<2*60)&&agoraMin>fimMin;
  }

  function renderCard(p, etapas) {
    const lote=dados[`${p}_lote`]||'—';
    const panela=dados[`${p}_panela`]||'—';
    const liga=dados[`${p}_liga`]||'';
    const obs=dados[`${p}_obs`]||'';
    const setup=dados[`${p}_setup_motivo`]||'';
    let atr=isAtrasado(p,etapas);
    const dataIni=dados[`${p}_data_ini`]||'';
    const horaIni=dados[`${p}_hora_ini`]||'';

    // Previsão de fim
    const familia=LIGA_FAMILIA[liga]||'CALCIO';
    const totalMedioBase=etapas.reduce((s,e)=>s+(e.m||0),0);
    const totalMedio=familia==='PURO'?totalMedioBase-480:totalMedioBase;
    let prevFimStr='';
    if(horaIni){
      const [hv,mv]=horaIni.split(':').map(Number);
      const baseV=new Date(2000,0,1,hv,mv,0,0);
      const resultV=new Date(baseV.getTime()+totalMedio*60000);
      let prevStr=`${String(resultV.getHours()).padStart(2,'0')}:${String(resultV.getMinutes()).padStart(2,'0')}`;
      if(dataIni){
        const [ano,mes,dia]=dataIni.split('-').map(Number);
        const dataBaseV=new Date(ano,mes-1,dia,hv,mv,0,0);
        const dataFimV=new Date(dataBaseV.getTime()+totalMedio*60000);
        prevStr=dataFimV.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+prevStr;
      }
      prevFimStr=prevStr;
    }

    // Tempo total em processo
    let tempoTotalHtml='';
    const ts=dados[`${p}_processo_inicio_ts`];
    if(dataIni&&horaIni){
      // data_ini + hora_ini tem prioridade — mais confiável
      const [ano,mes,dia]=dataIni.split('-').map(Number);
      const [hv,mv]=horaIni.split(':').map(Number);
      const inicioTs=new Date(ano,mes-1,dia,hv,mv,0,0).getTime();
      const dT=Math.floor((Date.now()-inicioTs)/60000);
      if(dT>=0) tempoTotalHtml=`⏳ ${Math.floor(dT/60)}:${String(dT%60).padStart(2,'0')}h em processo`;
    } else if(ts){
      // Fallback: timestamp salvo
      const dT=Math.floor((Date.now()-ts)/60000);
      if(dT>=0) tempoTotalHtml=`⏳ ${Math.floor(dT/60)}:${String(dT%60).padStart(2,'0')}h em processo`;
    } else if(horaIni){
      // Fallback: só hora — assume mesmo dia
      const agrMin=new Date().getHours()*60+new Date().getMinutes();
      const [hv,mv]=horaIni.split(':').map(Number);
      let dT=agrMin-(hv*60+mv);
      if(dT<0)dT+=1440;
      tempoTotalHtml=`⏳ ${Math.floor(dT/60)}:${String(dT%60).padStart(2,'0')}h em processo`;
    }

    let ultimaIdx=-1;
    etapas.forEach((e,i)=>{ if(dados[`${p}_${e.k}`]) ultimaIdx=i; });

    const rows=etapas.map((e,idx)=>{
      const ini=dados[`${p}_${e.k}`]||'';
      const fim=dados[`${p}_${e.k2}`]||'';
      const ativa=idx===ultimaIdx;
      const med=e.m?`<span class="medio-tv">T.M: ${Math.floor(e.m/60)}:${String(e.m%60).padStart(2,'0')}h</span>`:'';
      let exec='';
      // Proteger split de valores undefined
      if(ini){
        const prox=etapas.slice(idx+1).find(e2=>dados[`${p}_${e2.k}`]);
        if(prox && dados[`${p}_${prox.k}`]){
          const tsK=dados[`${p}_${e.k.replace('_ini','_ts')}`];
          const tsP=dados[`${p}_${prox.k.replace('_ini','_ts')}`];
          let diff;
          if(tsK&&tsP){ diff=Math.round((tsP-tsK)/60000); }
          else {
            const proxVal=dados[`${p}_${prox.k}`]||'';
            if(proxVal){
              const [h1,m1]=ini.split(':').map(Number);
              const [h2,m2]=proxVal.split(':').map(Number);
              diff=(h2*60+m2)-(h1*60+m1);
              if(diff<0)diff+=1440;
            }
          }
          if(diff!=null) exec=`<span class="exec-tv">⏱ ${Math.floor(diff/60)}:${String(diff%60).padStart(2,'0')}h</span>`;
        }
      }
      let linhaAtr=false;
      if(ini&&e.m){
        const prox=etapas.slice(idx+1).find(e2=>dados[`${p}_${e2.k}`]);
        if(prox){
          const [h1,m1]=ini.split(':').map(Number);
          const [h2,m2]=dados[`${p}_${prox.k}`].split(':').map(Number);
          let dr=(h2*60+m2)-(h1*60+m1);
          if(dr<0)dr+=1440;
          if(dr>e.m)linhaAtr=true;
        }
      }
      return `<tr class="${ativa?'tr-ativa':''} ${linhaAtr?'linha-atr-tv':''}">
        <td class="etapa-tv">${e.l}${med}${exec}</td>
        <td class="${ini?'val':'vz'}">${ini||'—'}</td>
        <td class="${fim?'val':'vz'}">${fim||'—'}</td>
      </tr>`;
    });
    const metade=Math.ceil(rows.length/2);
    const rowsA=rows.slice(0,metade).join('');
    const rowsB=rows.slice(metade).join('');

    const badge=atr?'<span class="badge-atraso">⚠ ATRASO</span>':'<span class="badge-andamento">● EM ANDAMENTO</span>';

    return `<div class="card-tv${atr?' atrasado':''}">
      <div class="card-top">
        <div class="card-inicio-box">
          ${liga?`<div class="card-liga-tv">⚗️ ${liga}</div>`:'<span></span>'}
          ${(dataIni||horaIni)?`<span class="card-label-top">Início</span><span class="card-valor-top">${dataIni?dataIni.split('-').reverse().slice(0,2).join('/'):''} ${horaIni}</span>`:'<span></span>'}
        </div>
        <div class="card-centro">
          <div class="card-panela-box">Panela ${panela}</div>
          ${tempoTotalHtml?`<div class="tempo-total-tv">${tempoTotalHtml}</div>`:''}
        </div>
        <div class="card-prevfim-box">
          ${prevFimStr?`<span class="card-label-top">Prev. Fim</span><span class="card-valor-top">${prevFimStr}</span>`:'<span></span>'}
        </div>
      </div>
      <div class="card-header-tv">
        <span class="card-lote-tv">Lote: ${lote}</span>${badge}
      </div>
      <div class="tabelas-wrap">
        <div class="tabela-col">
          <table class="card-table">
            <thead><tr><th>Etapa</th><th>Início</th><th>Fim</th></tr></thead>
            <tbody>${rowsA}</tbody>
          </table>
        </div>
        <div class="tabela-col">
          <table class="card-table">
            <thead><tr><th>Etapa</th><th>Início</th><th>Fim</th></tr></thead>
            <tbody>${rowsB}</tbody>
          </table>
        </div>
      </div>
      ${obs?`<div class="card-obs">OBS: ${obs}</div>`:''}
      ${setup?`<div class="setup-tv">⚠️ SETUP: ${setup}</div>`:''}
    </div>`;
  }

  function buildSlides() {
    const sup=[],inf=[];
    for(let i=1;i<=8;i++) { if(dados[`a${i}_lote`]) sup.push({p:`a${i}`,etapas:ETAPAS_SUP,tipo:'PURO/CÁLCIO',panela:parseInt(dados[`a${i}_panela`])||999}); }
    sup.sort((a,b)=>a.panela-b.panela);
    for(let i=1;i<=2;i++) { if(dados[`b${i}_lote`]) inf.push({p:`b${i}`,etapas:ETAPAS_INF,tipo:'SB/SN',panela:parseInt(dados[`b${i}_panela`])||999}); }
    inf.sort((a,b)=>a.panela-b.panela);
    // 1 card por slide
    slidesMeta=[];
    [...sup,...inf].forEach(c=>slidesMeta.push(c));
    totalSlides=slidesMeta.length;
  }

  function buildUI() {
    const vp=document.getElementById('viewport');
    const dotsEl=document.getElementById('dots');
    buildSlides();
    if(!slidesMeta.length){
      vp.style.transition='none';
      vp.innerHTML='<div class="slide-page"><div class="sem-ativos"><span>⏳</span>Nenhuma panela em andamento</div></div>';
      dotsEl.innerHTML='';
      document.getElementById('slide-info').textContent='';
      document.getElementById('secao-badge').textContent='';
      return;
    }
    const pagesHtml=slidesMeta.map(c=>{
      const titulo=c.tipo==='PURO/CÁLCIO'?'🏭 PANELAS DE PURO/CÁLCIO':'⚗️ PANELAS DE SB/SN';
      return `<div class="slide-page">
        <div class="secao-titulo-slide">${titulo}</div>
        ${renderCard(c.p,c.etapas)}
      </div>`;
    }).join('');
    vp.style.transition='none';
    vp.innerHTML=pagesHtml;
    dotsEl.innerHTML=totalSlides>1?slidesMeta.map((_,i)=>`<div class="slide-dot${i===slideAtual?' ativo':''}"></div>`).join(''):'';
    goTo(slideAtual<totalSlides?slideAtual:0,false);
  }

  function goTo(idx,animate=true){
    slideAtual=idx;
    const vp=document.getElementById('viewport');
    if(!vp)return;
    if(!animate)vp.style.transition='none';
    else vp.style.transition='transform 0.7s cubic-bezier(0.77,0,0.175,1)';
    vp.style.transform=`translateX(-${idx*100}%)`;
    if(!animate)setTimeout(()=>vp.style.transition='',50);
    document.querySelectorAll('.slide-dot').forEach((d,i)=>d.classList.toggle('ativo',i===idx));
    if(slidesMeta[idx]){
      document.getElementById('secao-badge').textContent=slidesMeta[idx].tipo;
      document.getElementById('slide-info').textContent=totalSlides>1?`${idx+1} / ${totalSlides}`:'';
    }
    const btnP=document.getElementById('btn-prev');
    const btnN=document.getElementById('btn-next');
    if(btnP)btnP.style.opacity=totalSlides>1?'1':'0';
    if(btnN)btnN.style.opacity=totalSlides>1?'1':'0';
  }

  window.navManual=(dir)=>{
    if(totalSlides<=1)return;
    goTo((slideAtual+dir+totalSlides)%totalSlides);
    iniciarTimer();
  };

  function nextSlide(){ if(totalSlides<=1)return; goTo((slideAtual+1)%totalSlides); }
  function iniciarTimer(){ if(slideTimer)clearInterval(slideTimer); slideTimer=setInterval(nextSlide,INTERVALO); }

  document.addEventListener('keydown',e=>{
    if(e.key==='ArrowRight')navManual(1);
    if(e.key==='ArrowLeft')navManual(-1);
  });
  let touchStartX=0;
  document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;},{passive:true});
  document.addEventListener('touchend',e=>{
    const diff=touchStartX-e.changedTouches[0].clientX;
    if(Math.abs(diff)>50)navManual(diff>0?1:-1);
  },{passive:true});

  onValue(ref(db,'formulario/dados'),(snap)=>{
    document.getElementById('dot').className='dot on';
    document.getElementById('status-txt').textContent='🟢 Conectado — tempo real';
    dados=snap.val()||{};
    buildUI();
    iniciarTimer();
  },()=>{
    document.getElementById('dot').className='dot';
    document.getElementById('status-txt').textContent='🔴 Sem conexão';
  });

  setInterval(()=>buildUI(),60000);
</script>
</body>
</html>
